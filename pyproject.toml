[project]
name = "predict-students-dropout-and-academic-success"
version = "0.1.0"
description = "Enrollment-time benchmarks for three student outcomes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=1.26,<3",
    "optuna==5.0.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
extended = ["lightgbm==4.7.0", "xgboost==3.2.0"]

[project.scripts]
student-outcomes-train = "student_outcomes.cli:main"
student-outcomes-predict = "student_outcomes.predict:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
notebook = ["ipykernel>=6", "jupyterlab>=4.4,<5", "matplotlib>=3.10,<4", "seaborn==0.13.2"]

[tool.uv.build-backend]
module-name = "student_outcomes"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
